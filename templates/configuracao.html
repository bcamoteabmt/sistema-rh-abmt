{% extends "base.html" %}
{% from "_macros.html" import csrf_input with context %}
{% block titulo %}Configuração inicial{% endblock %}
{% block conteudo %}
<div class="card login">
  <h1>Configuração inicial</h1>
  <p class="suave">Crie o primeiro usuário do RH. Ele poderá cadastrar os demais usuários depois.</p>
  <form method="post">
    {{ csrf_input() }}
    <label for="nome">Nome</label>
    <input id="nome" name="nome" required>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required>
    <label for="senha">Senha (mínimo 8 caracteres)</label>
    <input id="senha" name="senha" type="password" minlength="8" required>
    <div class="acoes"><button>Criar administrador</button></div>
  </form>
</div>
{% endblock %}
